<svg viewBox="0 0 720 980" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Arial, sans-serif">
  <title>Spring Boot Taskmaster Architektur</title>
  <desc>Vollständiger Programmablauf von Browser bis Datenbank mit Rückgabepfaden</desc>

  <!-- Background -->
  <rect width="720" height="980" fill="#0f1117"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Taskmaster — Vollständiger Programmablauf</text>
  <text x="360" y="58" text-anchor="middle" fill="#64748b" font-size="12">GET /tasks — von Browser bis Datenbank und zurück</text>

  <!-- BROWSER -->
  <rect x="210" y="80" width="300" height="80" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="360" y="108" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="700">Browser / Postman</text>
  <text x="360" y="128" text-anchor="middle" fill="#94a3b8" font-size="11">Schickt HTTP Request</text>
  <text x="360" y="146" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">GET http://localhost:8080/tasks</text>

  <!-- Arrow down: Browser to Controller -->
  <line x1="360" y1="160" x2="360" y2="215" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="268" y="172" width="185" height="22" rx="4" fill="#0f1117"/>
  <text x="360" y="187" text-anchor="middle" fill="#3b82f6" font-size="11">HTTP GET /tasks</text>

  <!-- CONTROLLER -->
  <rect x="110" y="215" width="500" height="100" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="360" y="243" text-anchor="middle" fill="#8b5cf6" font-size="13" font-weight="700">TaskController</text>
  <text x="360" y="263" text-anchor="middle" fill="#94a3b8" font-size="11">@RestController  •  @RequestMapping("/tasks")</text>
  <text x="360" y="283" text-anchor="middle" fill="#c4b5fd" font-size="11">@GetMapping — getAllTasks()</text>
  <rect x="170" y="292" width="380" height="16" rx="4" fill="#2d1b69"/>
  <text x="360" y="304" text-anchor="middle" fill="#a78bfa" font-size="10">Gibt List&lt;TaskDto&gt; zurueck — NUR oeffentliche Felder!</text>

  <!-- Arrow down: Controller to Service -->
  <line x1="360" y1="315" x2="360" y2="370" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="240" y="324" width="240" height="22" rx="4" fill="#0f1117"/>
  <text x="360" y="339" text-anchor="middle" fill="#8b5cf6" font-size="11">taskService.getAllTasks()</text>

  <!-- SERVICE -->
  <rect x="110" y="370" width="500" height="130" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="398" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">TaskService</text>
  <text x="360" y="418" text-anchor="middle" fill="#94a3b8" font-size="11">@Service — Geschaeftslogik &amp; Mapping</text>
  <rect x="140" y="428" width="440" height="60" rx="8" fill="#1a1200" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="360" y="447" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">MAPPING — Entity zu DTO</text>
  <text x="360" y="463" text-anchor="middle" fill="#94a3b8" font-size="10">tasks.stream()</text>
  <text x="360" y="477" text-anchor="middle" fill="#94a3b8" font-size="10">.map(task -&gt; new TaskDto(task.getId(), task.getDescription(), task.isCompleted()))</text>

  <!-- Arrow down: Service to Repository -->
  <line x1="360" y1="500" x2="360" y2="555" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="225" y="509" width="270" height="22" rx="4" fill="#0f1117"/>
  <text x="360" y="524" text-anchor="middle" fill="#f59e0b" font-size="11">taskRepository.findAll()</text>

  <!-- REPOSITORY -->
  <rect x="110" y="555" width="500" height="90" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="360" y="583" text-anchor="middle" fill="#10b981" font-size="13" font-weight="700">TaskRepository</text>
  <text x="360" y="603" text-anchor="middle" fill="#94a3b8" font-size="11">JpaRepository&lt;Task, Long&gt;</text>
  <text x="360" y="623" text-anchor="middle" fill="#6ee7b7" font-size="11">findAll() • save() • deleteById() — automatisch von Spring Data!</text>

  <!-- Arrow down: Repository to DB -->
  <line x1="360" y1="645" x2="360" y2="700" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="240" y="654" width="240" height="22" rx="4" fill="#0f1117"/>
  <text x="360" y="669" text-anchor="middle" fill="#10b981" font-size="11">SELECT * FROM tasks (SQL)</text>

  <!-- DATABASE -->
  <rect x="110" y="700" width="500" height="90" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="360" y="728" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">H2 Datenbank</text>
  <text x="360" y="748" text-anchor="middle" fill="#94a3b8" font-size="11">Tabelle TASKS</text>
  <text x="360" y="768" text-anchor="middle" fill="#fca5a5" font-size="11">ID | DESCRIPTION | COMPLETED | CREATED_AT</text>

  <!-- RETURN ARROWS (right side) -->
  <line x1="630" y1="745" x2="630" y2="600" stroke="#64748b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
  <rect x="638" y="658" width="70" height="36" rx="4" fill="#0f1117"/>
  <text x="673" y="672" text-anchor="middle" fill="#94a3b8" font-size="9">List&lt;Task&gt;</text>
  <text x="673" y="686" text-anchor="middle" fill="#94a3b8" font-size="9">(Entities)</text>

  <line x1="630" y1="555" x2="630" y2="500" stroke="#64748b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
  <rect x="638" y="518" width="70" height="24" rx="4" fill="#0f1117"/>
  <text x="673" y="534" text-anchor="middle" fill="#94a3b8" font-size="9">List&lt;Task&gt;</text>

  <line x1="630" y1="370" x2="630" y2="315" stroke="#64748b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
  <rect x="635" y="328" width="78" height="28" rx="4" fill="#1a1200" stroke="#f59e0b" stroke-width="1"/>
  <text x="673" y="340" text-anchor="middle" fill="#fbbf24" font-size="9">List&lt;TaskDto&gt;</text>
  <text x="673" y="352" text-anchor="middle" fill="#fbbf24" font-size="9">MAPPING!</text>

  <line x1="630" y1="215" x2="630" y2="160" stroke="#64748b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
  <rect x="638" y="172" width="70" height="28" rx="4" fill="#0f1117"/>
  <text x="673" y="184" text-anchor="middle" fill="#94a3b8" font-size="9">JSON</text>
  <text x="673" y="198" text-anchor="middle" fill="#94a3b8" font-size="9">Response</text>

  <!-- Labels -->
  <text x="673" y="810" text-anchor="middle" fill="#475569" font-size="10">Rueckgabe</text>
  <text x="360" y="810" text-anchor="middle" fill="#475569" font-size="10">Aufruf</text>

  <!-- LEGEND BOX -->
  <rect x="50" y="830" width="620" height="130" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="360" y="855" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Warum TaskDto? — Das SRP-Prinzip</text>
  <circle cx="80" cy="878" r="5" fill="#ef4444"/>
  <text x="95" y="882" fill="#94a3b8" font-size="11">Task (Entity) hat ALLE DB-Felder inkl. interner Felder (createdAt)</text>
  <circle cx="80" cy="900" r="5" fill="#10b981"/>
  <text x="95" y="904" fill="#94a3b8" font-size="11">TaskDto gibt NUR weiter was der Browser sehen darf (id, description, completed)</text>
  <circle cx="80" cy="922" r="5" fill="#f59e0b"/>
  <text x="95" y="926" fill="#94a3b8" font-size="11">Service macht das Mapping — Controller weiss nichts von der DB-Struktur</text>
  <line x1="80" y1="942" x2="200" y2="942" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="210" y="946" fill="#64748b" font-size="10">= Rueckgabepfad</text>
  <line x1="350" y1="942" x2="470" y2="942" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="946" fill="#64748b" font-size="10">= Aufrufpfad</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
